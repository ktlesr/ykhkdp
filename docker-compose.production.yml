# ── YKH-KDP · üretim (Dokploy) ────────────────────────────────────────────────
#
# İki servis:
#   web       Next.js; alan adı ve TLS Dokploy tarafından bağlanır
#   worker    açılışta şemayı kurar, sonra AI değerlendirme döngüsüne girer
#
# ═══ BU DOSYADA HİÇ AKILLILIK YOK — BİLEREK ═════════════════════════════════
#
# Değişkenler DÜZ `${AD}` biçiminde. Varsayılan (`:-`), zorunluluk (`:?`) ve
# iç içe ifade YOK. Sebebi Dokploy'da ölçülen iki davranış:
#
#   1. YAML birleştirme anahtarı (`<<: *ankra`) düşüyor — ortak tanım
#      servislere hiç ulaşmadı.
#   2. `${A:-…${B}…}` biçimi çözülmüyor — `DATABASE_URL` boş geldi ve uygulama
#      "üretimde tanımlı değil" diyerek durdu.
#
# İkisi de yerelde `docker compose config` ile DOĞRU çalışıyordu; fark
# Dokploy'un compose dosyasını kendi ayrıştırıcısından geçirmesi. Bu yüzden
# artık hiçbir şey türetilmiyor: ne verirseniz o gidiyor.
#
# Eksik ya da tutarsız yapılandırmayı UYGULAMA yakalıyor ve ne yapılacağını
# yazıyor (`packages/database/src/kur.ts`, `baglanti.ts`):
#   · adres ayrıştırılamıyorsa                        → sebebini ve çözümünü söyler
#   · uygulama rolü `ykh_app` değilse                 → açılmaz (RLS baypas edilirdi)
#   · yerel adrese bakıyorsa                          → açılmaz
#   · DATABASE_URL parolası YKH_APP_PAROLA ile ayrıysa → kurulum durur
#
# ═══ AĞ ═════════════════════════════════════════════════════════════════════
#
# Dokploy'un veritabanı servisleri `dokploy-network` üzerinde durur. Bu compose
# kendi ağını kursaydı uygulama veritabanını GÖREMEZDİ.
#
# ═══ ŞEMAYI WORKER KURAR ════════════════════════════════════════════════════
#
# Ayrı bir tek seferlik `kurulum` servisi vardı; Dokploy onu çalıştırmadı ve
# sonuç `relation "oneri" does not exist` oldu. Kurulum tekrar çalıştırılabilir
# ve `pg_advisory_xact_lock` ile yarış korumalı, her açılışta koşması güvenli.
# Web ilk ~30 saniye şema yokken hata verebilir ve kendiliğinden düzelir.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [dokploy-network]
    environment:
      # SAHİP bağlantısını ALMAZ. RLS'in uygulandığı tek yol bu: `ykh_app`
      # superuser değil, tablo sahibi değil, BYPASSRLS taşımıyor.
      DATABASE_URL: ${DATABASE_URL}
      YKH_SITE_URL: ${YKH_SITE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YKH_MODEL_SNAPSHOT: ${YKH_MODEL_SNAPSHOT}
      YKH_LOG_SEVIYE: ${YKH_LOG_SEVIYE}
      NODE_ENV: production
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks: [dokploy-network]
    command: ["sh", "-c", "pnpm db:kur && pnpm worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # SAHİP bağlantısı YALNIZCA burada. Web onu görmüyor — internete bakan
      # yüzey hâlâ yalnızca `ykh_app` rolüyle çalışıyor.
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      YKH_APP_PAROLA: ${YKH_APP_PAROLA}
      YKH_YONETICI_EPOSTA: ${YKH_YONETICI_EPOSTA}
      YKH_YONETICI_PAROLA: ${YKH_YONETICI_PAROLA}
      YKH_YONETICI_AD: ${YKH_YONETICI_AD}
      YKH_KUR_BELGELER: ${YKH_KUR_BELGELER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YKH_MODEL_SNAPSHOT: ${YKH_MODEL_SNAPSHOT}
      YKH_WORKER_ARALIK: ${YKH_WORKER_ARALIK}
      YKH_LOG_SEVIYE: ${YKH_LOG_SEVIYE}

networks:
  dokploy-network:
    external: true
