# ── YKH-KDP · üretim (Dokploy) ────────────────────────────────────────────────
#
# Dokploy'da "Compose" tipi bir uygulama olarak kullanılır. Üç servis:
#
#   kurulum   şema + referans veri + ilk yönetici — bir kez çalışıp çıkar
#   web       Next.js; alan adı ve TLS Dokploy tarafından bağlanır
#   worker    AI değerlendirme döngüsü
#
# VERİTABANI BURADA DEĞİL. Dokploy'un kendi PostgreSQL servisi kullanılıyor:
# yedekleme, izleme ve sürüm yükseltme onun panelinden yönetiliyor. Paketli
# bir Postgres konteyneri olsaydı iki veritabanı doğardı ve Dokploy'un hazır
# yedekleme ekranı işe yaramazdı.
#
# BAĞLANTI ADRESİ İKİ PARÇADAN KURULUYOR — ve tek yerden:
#
#   DATABASE_URL_OWNER  →  YKH_DB_SAHIP  + POSTGRES_PAROLA   (şema sahibi)
#   DATABASE_URL        →  ykh_app       + YKH_APP_PAROLA    (uygulama rolü)
#
# İkisi de aynı sunucu ve aynı veritabanı adını kullanıyor. Böylece adresi iki
# kez yazma ve birinde yazım hatası yapma ihtimali yok. Gerekirse ikisi de
# doğrudan geçersiz kılınabilir (ör. TLS parametresi eklemek için).
#
# `kurulum` servisi web'den ÖNCE biter (`service_completed_successfully`).
# Sıra bu yüzden garanti: uygulama hiçbir zaman eksik şemayla açılmaz.
#
# AĞ: Dokploy'un veritabanı servisleri `dokploy-network` üzerinde durur. Bu
# compose kendi ağını kursaydı uygulama veritabanını GÖREMEZDİ ve hata
# "bağlanamıyor" olurdu — sebebi hiçbir yerde yazmazdı. Ağ dışarıdan bağlanıyor.

# YAML BİRLEŞTİRME ANAHTARI KULLANILMIYOR — bilerek.
#
# Yaşandı: ortak bir ankra tanımlanıp servislere birleştirme anahtarıyla
# veriliyordu. Yerelde `docker compose config` doğru çözüyordu ama Dokploy
# compose dosyasını AYRIŞTIRIP YENİDEN YAZIYOR ve birleştirme o turda düşüyor.
# Sonuç: `DATABASE_URL` konteynere hiç ulaşmadı, uygulama "üretimde tanımlı
# değil" diyerek durdu — hata mesajı doğruydu, sebebi burasıydı.
#
# Üç satır tekrar, bir satır zarafetten iyi. Değiştirirken üçünü de değiştirin.
#
# VARSAYILANIN İÇİNDE `:?` KONTROLÜ YOK — bilerek. Ölçüldü: Compose
# `${A:-…${B:?hata}…}` ifadesinde B kontrolünü A VERİLMİŞ OLSA BİLE
# çalıştırıyor. Yani `DATABASE_URL` doğrudan yapıştırıldığında bile parça
# değişkenleri istiyor ve dağıtım durduruyordu. Eksik yapılandırmayı artık
# uygulama yakalıyor: sunucu adı boş kalırsa `adresSec()` hangi değişkenin
# eksik olduğunu yazarak duruyor.

services:
  kurulum:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"
    command: ["pnpm", "db:kur"]
    networks: [dokploy-network]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://ykh_app:${YKH_APP_PAROLA}@${YKH_DB_SUNUCU}:${YKH_DB_PORT:-5432}/${YKH_DB_ADI}}"
      # Kurulum SAHİP bağlantısıyla çalışır: migration, `create role`,
      # `create extension pg_trgm` ve `ykh_app` parolasının değiştirilmesi için.
      # Dokploy'un veritabanı kullanıcısı bu işleri yapabilir (resmî imajda
      # POSTGRES_USER superuser'dır).
      DATABASE_URL_OWNER: "${DATABASE_URL_OWNER:-postgres://${YKH_DB_SAHIP}:${POSTGRES_PAROLA}@${YKH_DB_SUNUCU}:${YKH_DB_PORT:-5432}/${YKH_DB_ADI}}"
      YKH_APP_PAROLA: ${YKH_APP_PAROLA:?YKH_APP_PAROLA zorunlu}
      YKH_YONETICI_EPOSTA: ${YKH_YONETICI_EPOSTA:?YKH_YONETICI_EPOSTA zorunlu}
      YKH_YONETICI_PAROLA: ${YKH_YONETICI_PAROLA:?YKH_YONETICI_PAROLA zorunlu}
      YKH_YONETICI_AD: ${YKH_YONETICI_AD:-Yönetici}
      # İlk kurulumda `evet`, sonra `hayir`: belgeler yeniden yüklenince
      # `belge.id` değişir ve eski değerlendirmelerin atıf adresleri eskir.
      YKH_KUR_BELGELER: ${YKH_KUR_BELGELER:-hayir}
      YKH_LOG_SEVIYE: ${YKH_LOG_SEVIYE:-info}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [dokploy-network]
    depends_on:
      kurulum:
        condition: service_completed_successfully
    environment:
      # Web SAHİP bağlantısını ALMAZ. RLS'in uygulandığı tek yol bu:
      # `ykh_app` superuser değil, tablo sahibi değil, BYPASSRLS taşımıyor.
      DATABASE_URL: "${DATABASE_URL:-postgres://ykh_app:${YKH_APP_PAROLA}@${YKH_DB_SUNUCU}:${YKH_DB_PORT:-5432}/${YKH_DB_ADI}}"
      # Paylaşım kartlarının ve sitemap'in mutlak adresi. Verilmezse kartlar
      # localhost'a bakar ve WhatsApp/LinkedIn/X hiçbir şey gösteremez.
      YKH_SITE_URL: ${YKH_SITE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YKH_MODEL_SNAPSHOT: ${YKH_MODEL_SNAPSHOT:-}
      YKH_LOG_SEVIYE: ${YKH_LOG_SEVIYE:-info}
      NODE_ENV: production
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks: [dokploy-network]
    depends_on:
      kurulum:
        condition: service_completed_successfully
    environment:
      # Worker da sahip bağlantısını almaz; RLS onun için de uygulanır.
      DATABASE_URL: "${DATABASE_URL:-postgres://ykh_app:${YKH_APP_PAROLA}@${YKH_DB_SUNUCU}:${YKH_DB_PORT:-5432}/${YKH_DB_ADI}}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YKH_MODEL_SNAPSHOT: ${YKH_MODEL_SNAPSHOT:-}
      YKH_WORKER_ARALIK: ${YKH_WORKER_ARALIK:-5000}
      YKH_LOG_SEVIYE: ${YKH_LOG_SEVIYE:-info}

networks:
  dokploy-network:
    external: true
